name: Update public data

on:
  schedule:
    # UTC: an early attempt and an afternoon recovery, away from the hourly rush.
    - cron: "23 11 * * *"
    - cron: "23 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-embalses-db
  cancel-in-progress: false

jobs:
  reservoirs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Update and validate reservoirs
        run: npm run data:update
      - name: Publish reservoir database
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/embalses.db
          if git diff --cached --quiet; then
            echo "Reservoir database unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: refresh reservoir database"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "Reservoir database published." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish database to Hostinger
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          HOSTINGER_PUBLISH_KEY: ${{ secrets.HOSTINGER_PUBLISH_KEY }}
        run: |
          test -n "$HOSTINGER_PUBLISH_KEY" || { echo "HOSTINGER_PUBLISH_KEY is missing" >&2; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/hostinger-publish-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$HOSTINGER_PUBLISH_KEY" > "$key_file"
          commit=$(git rev-parse HEAD)
          hash=$(sha256sum data/embalses.db | cut -d ' ' -f 1)
          ssh -p 65002 -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/hostinger_known_hosts \
            -o ConnectTimeout=15 u773681749@213.130.145.72 "publish $commit $hash"
          node scripts/verify-website.mjs
          echo "Live website database verified." >> "$GITHUB_STEP_SUMMARY"
      - name: Data summary
        run: npm run data:summary >> "$GITHUB_STEP_SUMMARY"

  weather:
    # A separate checkout starts after publication, even if the reservoir source fails.
    # Weather errors cannot undo or prevent publication of validated reservoir data.
    needs: reservoirs
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.event.schedule == '23 11 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update AEMET caches
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: npm run data:update:aemet
      - name: Publish weather caches
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          if git diff --cached --quiet; then
            echo "Weather caches unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: refresh AEMET cache"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "Weather caches published." >> "$GITHUB_STEP_SUMMARY"
      - name: Deliver and verify weather on Hostinger
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          HOSTINGER_PUBLISH_KEY: ${{ secrets.HOSTINGER_PUBLISH_KEY }}
        run: |
          test -n "$HOSTINGER_PUBLISH_KEY" || { echo "HOSTINGER_PUBLISH_KEY is missing" >&2; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/hostinger-weather-key"
          bundle="$RUNNER_TEMP/weather.json.gz"
          trap 'rm -f "$key_file" "$bundle"' EXIT
          printf '%s\n' "$HOSTINGER_PUBLISH_KEY" > "$key_file"
          hash=$(node scripts/weather-publication.mjs "$bundle")
          commit=$(git rev-parse HEAD)
          ssh -p 65002 -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/hostinger_known_hosts \
            -o ConnectTimeout=15 u773681749@213.130.145.72 "publish-weather $commit $hash" < "$bundle"
          node scripts/verify-website.mjs --weather
          echo "Live website weather verified." >> "$GITHUB_STEP_SUMMARY"
